<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GFB Machine Inspection Checklist (F52)</title>
<meta name="theme-color" content="#0d6b5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#eef2f2; --surface:#ffffff; --surface-2:#f6f8f8; --ink:#152226; --muted:#5a6b70; --line:#d5dddd;
  --accent:#0d6b5f; --accent-soft:#dcefeb; --accent-ink:#ffffff;
  --ok:#2e7d3c; --ok-soft:#e1f1e3; --warn:#a66300; --warn-soft:#fbeed8; --bad:#b3261e; --bad-soft:#f9e1df; --info:#2d5f9a; --info-soft:#e2ebf6;
  --crit:#1f4fb0; --r:10px; --nav-h:58px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1517; --surface:#162024; --surface-2:#1b272b; --ink:#e2eaeb; --muted:#93a4a8; --line:#2b383c;
  --accent:#4fb3a3; --accent-soft:#16352f; --accent-ink:#06201b;
  --ok:#6cc27a; --ok-soft:#173222; --warn:#e3a54a; --warn-soft:#352711; --bad:#f08a80; --bad-soft:#3a1a18; --info:#8ab4e8; --info-soft:#18283c; --crit:#8ab4e8;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}
h1{font-size:19px} h2{font-size:17px} h3{font-size:15px}
a{color:var(--accent)}
.hide{display:none!important}
.muted{color:var(--muted)} .small{font-size:13px} .nowrap{white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* top bar + navigation */
.top{position:sticky;top:0;z-index:20;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.top .brand{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand small{font-weight:500;opacity:.85}
.top button{background:transparent;border:1px solid color-mix(in srgb,var(--accent-ink) 45%,transparent);color:inherit;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px}
.who{font-size:12.5px;text-align:right;line-height:1.2;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{display:flex;gap:4px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:46px;z-index:19}
.nav a{padding:11px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.nav a.on{color:var(--accent);border-color:var(--accent)}
main{max-width:1180px;margin:0 auto;padding:14px 14px 40px}
@media (max-width:700px){
  .nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;justify-content:space-around;padding:0 2px env(safe-area-inset-bottom);height:calc(var(--nav-h) + env(safe-area-inset-bottom))}
  .nav a{flex:1;text-align:center;padding:8px 2px;font-size:12.5px;border-bottom:0;border-top:3px solid transparent;display:flex;align-items:center;justify-content:center}
  .nav a.on{border-color:var(--accent)}
  main{padding:12px 10px calc(var(--nav-h) + 90px)}
}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.pri.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.ans button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
input[type=text],input[type=password],input[type=date],input[type=time],input[type=email],select,textarea{width:100%;min-height:42px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);}
textarea{min-height:64px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}
label.f>span{display:block;margin-bottom:4px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:650;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.banner{border-radius:var(--r);padding:10px 12px;margin:10px 0;background:var(--warn-soft);color:var(--warn);font-weight:600}
.banner.bad{background:var(--bad-soft);color:var(--bad)} .banner.info{background:var(--info-soft);color:var(--info)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;cursor:pointer;transition:border-color .15s}
.mcard:hover{border-color:var(--accent)}
.mcard .fn{font-size:12.5px;color:var(--muted)}
.mcard.off{opacity:.62}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.datebar input{width:auto}
.tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.list{border-collapse:collapse;width:100%;min-width:640px}
table.list th,table.list td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.list th{font-size:12.5px;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
table.list tr.click{cursor:pointer} table.list tr.click:hover td{background:var(--surface-2)}

/* login */
.login{max-width:400px;margin:6vh auto;padding:0 14px}
.login .logo{display:block;height:74px;margin:0 auto 10px;border-radius:8px}
.tabs{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:14px 0}
.tabs button{flex:1;padding:9px;border:0;background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--accent);color:var(--accent-ink)}

/* round fill-in */
.sec-h{position:sticky;top:46px;z-index:5;background:var(--accent-soft);color:var(--ink);font-weight:700;padding:8px 12px;border-radius:8px;margin:16px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (min-width:701px){.sec-h{top:92px}}
.sec-h input{width:150px;min-height:34px;padding:4px 8px}
.item{display:grid;grid-template-columns:76px 1fr;gap:10px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px}
.item.a-ok{border-left-color:var(--ok)} .item.a-ng{border-left-color:var(--bad)} .item.a-na{border-left-color:var(--muted)}
.item .ph{width:76px;height:76px;border-radius:8px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);cursor:zoom-in;display:block}
.item .ph.none{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:default;text-align:center}
.item .more{font-size:11px;color:var(--muted);text-align:center}
.item .nm{font-weight:700}
.item .cr{color:var(--crit);font-size:13.5px;margin:2px 0 8px}
.item .full{grid-column:1/-1}
.auto{min-height:42px;padding:9px 10px;border:1px dashed var(--line);border-radius:9px;background:var(--surface-2);font-size:14px;font-weight:400;color:var(--ink)}
.rv{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.rv .rvb{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.rv .rvb button{min-height:44px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;cursor:pointer;padding:4px}
.rv .rvb button.go{border-color:var(--ok);color:var(--ok)}.rv .rvb button.hold{border-color:var(--bad);color:var(--bad)}
@media (max-width:420px){.rv .rvb{grid-template-columns:1fr}}
.ans{display:grid;grid-template-columns:1fr 1.25fr 1.25fr .8fr;gap:6px}
.ans button{min-height:44px;font-size:14px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;padding:4px 6px}
.ans button.on.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ans button.on.ng{background:var(--bad);border-color:var(--bad);color:#fff}
.ans button.on.na{background:var(--muted);border-color:var(--muted);color:#fff}
.item textarea{margin-top:8px}
@media (min-width:701px){.item{grid-template-columns:76px 1fr minmax(330px,42%);align-items:center}.item .full{grid-column:auto}}
.item .rd{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.foot .in{max-width:1150px;width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (max-width:700px){.foot{bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}}
.prog{height:8px;background:var(--surface-2);border-radius:9px;overflow:hidden;flex:1;min-width:90px;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent)}
.rcard{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px}
.rcard b{font-size:15px}

/* F52 form view (screen + print) */
.f52-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff;color:#111;max-height:78vh}
table.f52{border-collapse:collapse;font-size:12px;width:100%;color:#111;background:#fff}
table.f52 th,table.f52 td{border:1px solid #333;padding:3px 4px;text-align:center;vertical-align:middle}
table.f52 th{background:#d9d9d9;font-weight:700;font-size:11px}
table.f52 td.sec{background:#bfbfbf;font-weight:700;writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;width:22px;font-size:11px}
table.f52 td.part{background:#d9d9d9;text-align:left;min-width:120px}
table.f52 td.part.flag{background:#ffff00}
table.f52 td.crit{color:#1f3fbf;min-width:150px;max-width:220px}
table.f52 td.crit img{height:44px;margin:2px 1px 0;vertical-align:middle;border:1px solid #999}
table.f52 td.ng{color:#b3261e;font-weight:700}
table.f52 td.sig{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11px;width:26px}
table.f52 td.rm{font-size:10px;text-align:left;max-width:110px}
table.f52 .rm{font-size:10px;font-weight:400;color:#111}
table.f52 .rm.dec{font-weight:700;color:#b3261e}
#print{display:none}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;overflow:auto}
.lightbox img{max-width:96vw;max-height:70vh;border-radius:8px;background:#fff}
.lightbox .cap{color:#fff;text-align:center;max-width:640px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--surface);border-radius:14px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto}
.modal h3{margin-bottom:8px;font-size:17px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;max-width:92vw;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.toast.bad{background:var(--bad);color:#fff}
.fx{display:flex;gap:6px 14px;flex-wrap:wrap}
.fx label{display:inline-flex;align-items:center;gap:5px;min-height:30px}
.fx input{width:19px;height:19px}
.ed-item{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--line)}
@media (max-width:700px){.ed-item{grid-template-columns:1fr}}
.ed-item textarea{min-height:42px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

@media print{
  body{background:#fff;color:#000}
  #app,.toast,.modal-bg,.lightbox{display:none!important}
  #print{display:block}
  .pg{page-break-after:always;break-after:page}
  .pg:last-child{page-break-after:auto;break-after:auto}
  table.f52{font-size:7.5pt;width:100%}
  table.f52 th{font-size:6.5pt}
  table.f52 thead{display:table-header-group} table.f52 tfoot{display:table-footer-group}
  table.f52 tr{page-break-inside:avoid;break-inside:avoid}
  table.f52 td.crit{min-width:0;max-width:none;width:23%}
  table.f52 td.crit img{height:10mm}
  table.f52 td.vcol{position:relative;width:5.5mm;min-width:5.5mm;padding:0;font-size:6.5pt}
  table.f52 td.vcol::before{content:"";display:block;width:5.5mm;height:1px}
  table.f52 td.vcol.secp{background:#bfbfbf;font-weight:700}
  table.f52 td.vcol span{position:absolute;top:1mm;left:50%;z-index:1;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);white-space:nowrap}
  table.f52 td.part{min-width:0;width:13%}
  table.f52 td.sec,table.f52 td.sig{font-size:6.5pt}
  table.f52 td.rm{font-size:6pt}
  table.f52 th,table.f52 td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.f52 .hd td{border:0;padding:0 0 3mm}
  table.f52 .ft td{border:0;padding:3mm 0 0}
  .f-hd{display:flex;justify-content:space-between;font-size:8pt;text-align:left}
  .f-ti{font-size:14pt;font-weight:700;text-align:left;margin:2mm 0 3mm 4mm}
  .f-dt{font-size:9pt;text-align:left;margin:0 0 1mm 14mm}
  .f-ft{display:flex;justify-content:space-between;font-size:8pt}
  .e-rec{font-size:7.5pt;margin-top:3mm;text-align:left}
  .e-rec td,.e-rec th{border:1px solid #666;padding:1.2mm 2mm;text-align:left}
  .e-rec table{border-collapse:collapse;width:100%}
}
</style>
</head>
<body>
<div id="app"><div style="padding:60px;text-align:center"><span class="spin"></span></div></div>
<div id="print"></div>
<style id="pagecss"></style>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script>
'use strict';
/* ============ GFB Machine Inspection Checklist (F52) ============
   Front end only. All rules (who may fill, check, verify) are enforced in the database (setup.sql). */
const CFG = window.GFB_CONFIG || {};
const USER_DOMAIN = '@mic.gfbfood.com';       // username accounts for staff without email
const sb = supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth: {storageKey: 'gfb-mic-auth', persistSession: true, autoRefreshToken: true}});
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
let LANG = 'en'; try { LANG = localStorage.getItem('mic_lang') || 'en'; } catch (e) {}
const T = (en, bm) => LANG === 'bm' ? bm : en;
const S = {me: null, tpls: [], today: null, date: null, day: [], sheet: null, round: null, ans: {}, refs: {}, dirty: false, saving: false, savedAt: null, rec: null, ed: null, users: null, timer: null, poll: null, authTab: 'in'};
const can = f => !!(S.me && S.me.active && (f === 'review' ? ['check', 'verify', 'admin'].some(x => (S.me.funcs || []).includes(x)) : (S.me.funcs || []).includes(f)));
const FUNCS = ['fill', 'check', 'verify', 'admin'];
const FUNC = () => ({fill: T('Inspect (Done by)', 'Periksa (Done by)'), check: 'Check by', verify: 'Verify by', admin: 'Admin'});
const myFuncs = () => (S.me.funcs || []).map(f => ({fill: 'Done by', check: 'Check by', verify: 'Verify by', admin: 'Admin'}[f])).join(', ');
const MSTAT = () => ({active: T('In use', 'Digunakan'), pending: T('Criteria pending', 'Kriteria belum muktamad'), not_in_use: T('Not in use', 'Tidak digunakan')});

function fmtD(d) { if (!d) return ''; const p = String(d).slice(0, 10).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function fmtDT(t) { if (!t) return ''; const d = new Date(t); const z = n => String(n).padStart(2, '0'); return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes()); }
function addDays(d, n) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.toISOString().slice(0, 10); }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function initials(n) { return String(n || '').trim().split(/\s+/).filter(w => !/^(bin|binti|bt|b|a\/l|a\/p|al|ap)$/i.test(w)).map(w => w[0]).join('').toUpperCase().slice(0, 4); }
function errMsg(e) { let m = (e && e.message) || String(e); const p = m.split(' / '); if (p.length === 2) m = LANG === 'bm' ? p[0] : p[1]; if (/Failed to fetch|NetworkError|Load failed/i.test(m)) m = T('No internet connection. Please try again.', 'Tiada sambungan internet. Sila cuba lagi.'); return m; }
async function rpc(fn, args) { const {data, error} = await sb.rpc(fn, args || {}); if (error) throw error; return data; }
function toast(m, bad) { $$('.toast').forEach(x => x.remove()); const d = document.createElement('div'); d.className = 'toast' + (bad ? ' bad' : ''); d.setAttribute('role', 'status'); d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 2800); }
function fail(e) { console.error(e); toast(errMsg(e), true); }
function tpl(key) { return S.tpls.find(t => t.key === key); }
function allItems(t) { return t.sections.flatMap(s => s.items); }

/* ---------- small dialogs ---------- */
function ask(o) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><h3>' + esc(o.title) + '</h3>' + (o.body ? '<div class="small" style="margin-bottom:10px">' + o.body + '</div>' : '') +
      (o.input ? '<label class="f"><span>' + esc(o.label || '') + '</span>' + (o.input === 'password' ? '<input type="password" id="askv" autocomplete="new-password">' : '<textarea id="askv" maxlength="300"></textarea>') + '</label>' : '') +
      '<div class="row" style="justify-content:flex-end">' + (o.noCancel ? '' : '<button class="btn" data-x="0">' + T('Cancel', 'Batal') + '</button>') + '<button class="btn pri' + (o.danger ? ' bad' : '') + '" data-x="1">' + esc(o.ok || 'OK') + '</button></div></div>';
    document.body.appendChild(bg);
    const v = $('#askv', bg); if (v) v.focus(); else $('[data-x="1"]', bg).focus();
    bg.addEventListener('click', e => {
      const b = e.target.closest('[data-x]'); if (!b) return;
      if (b.dataset.x === '1') { const val = v ? v.value.trim() : true; if (o.input && o.required && !val) { v.focus(); toast(T('Please fill this in', 'Sila isi ruangan ini'), true); return; } bg.remove(); res(o.input ? val : true); }
      else { bg.remove(); res(null); }
    });
  });
}
function lightbox(imgs, cap) {
  const d = document.createElement('div'); d.className = 'lightbox';
  d.innerHTML = imgs.map(i => '<img src="' + esc(i) + '" alt="">').join('') + '<div class="cap">' + cap + '</div><button class="btn">' + T('Close', 'Tutup') + '</button>';
  d.addEventListener('click', () => d.remove()); document.body.appendChild(d);
}

/* ---------- sign-in ---------- */
function loginId(v) { v = String(v || '').trim().toLowerCase(); return v.includes('@') ? v : v.replace(/\s+/g, '') + USER_DOMAIN; }
function vLogin(msg) {
  const reg = false;   // self-registration is off: an Admin adds every user (Users > Add user)

async function doAuth(f) {
  const reg = false;
  const id = f.uid.value.trim(), pw = f.pw.value, btn = $('button[type=submit]', f);
  if (!/^[A-Za-z0-9._@+-]{3,80}$/.test(id.replace(/\s+/g, ''))) return toast(T('Username: letters and numbers only, at least 3 characters', 'Nama pengguna: huruf dan nombor sahaja, sekurang-kurangnya 3 aksara'), true);
  btn.disabled = true;
  try {
    if (reg) {
      if (pw !== f.pw2.value) throw new Error(T('The two passwords are not the same', 'Kedua-dua kata laluan tidak sama'));
      const name = f.name.value.trim();
      const {data, error} = await sb.auth.signUp({email: loginId(id), password: pw, options: {data: {name}}});
      if (error) throw error;
      if (!data.session) { S.authTab = 'in'; return vLogin(T('Account created. Check your email to confirm it, then sign in.', 'Akaun didaftar. Semak emel anda untuk pengesahan, kemudian log masuk.')); }
      S.regName = name;
    } else {
      const {error} = await sb.auth.signInWithPassword({email: loginId(id), password: pw});
      if (error) throw new Error(/Invalid login/i.test(error.message) ? T('Wrong username or password', 'Nama pengguna atau kata laluan salah') : error.message);
    }
    await boot();
  } catch (e) { fail(e); btn.disabled = false; }
}
async function forgot() {
  const v = ($('#authf [name=uid]') || {}).value || '';
  if (!v.includes('@')) return ask({title: T('Forgot password', 'Lupa kata laluan'), body: T('If you sign in with a <b>username</b>, ask the Admin to set a new password for you (Users &gt; Reset password).<br><br>If you sign in with a company <b>email</b>, type the email in the box first, then tap "Forgot password?" again.', 'Jika anda log masuk dengan <b>nama pengguna</b>, minta Admin tetapkan kata laluan baharu (Pengguna &gt; Set semula kata laluan).<br><br>Jika anda log masuk dengan <b>emel</b> syarikat, taip emel dahulu dan tekan "Lupa kata laluan?" sekali lagi.'), noCancel: true});
  try { const {error} = await sb.auth.resetPasswordForEmail(v.trim(), {redirectTo: location.origin + location.pathname}); if (error) throw error; toast(T('Password reset email sent', 'Emel set semula kata laluan telah dihantar')); } catch (e) { fail(e); }
}
async function changePw() {
  const p = await ask({title: T('Change my password', 'Tukar kata laluan saya'), input: 'password', label: T('New password (at least 8 characters)', 'Kata laluan baharu (sekurang-kurangnya 8 aksara)'), required: true, ok: T('Save', 'Simpan')});
  if (!p) return; if (p.length < 8) return toast(T('At least 8 characters', 'Sekurang-kurangnya 8 aksara'), true);

}
function vPending() {
  $('#app').innerHTML = '<div class="login"><img class="logo" src="gfb-logo.png" alt="GFB Food"><div class="card" style="text-align:center"><h2>' + T('Waiting for activation', 'Menunggu pengaktifan') + '</h2><p>' + esc(S.me.name) + ' (' + esc(S.me.login) + ')</p><p class="muted">' +
    T('Your account has been created. Please ask the Admin to activate it and set your role, then tap "Check again".', 'Akaun anda telah didaftar. Sila minta Admin aktifkan akaun dan tetapkan peranan anda, kemudian tekan "Semak semula".') +
    '</p><div class="row" style="justify-content:center"><button class="btn pri" data-act="recheck">' + T('Check again', 'Semak semula') + '</button><button class="btn" data-act="signout">' + T('Sign out', 'Log keluar') + '</button></div></div><p style="text-align:center"><button class="btn sm" data-act="lang">' + (LANG === 'bm' ? 'English' : 'Bahasa Malaysia') + '</button></p></div>';

async function boot() {
  const {data} = await sb.auth.getSession();
  if (!data || !data.session) { S.me = null; return vLogin(); }
  try {
    S.me = await rpc('mic_me', {p_name: S.regName || null}); S.regName = null;
    if (!S.me.active) return vPending();
    let b = await rpc('mic_boot');
    if (!b.templates.length) {
      if (!can('admin')) { $('#app').innerHTML = '<div class="login"><div class="card" style="text-align:center"><p>' + T('The checklists have not been loaded yet. Please ask the Admin to sign in once.', 'Senarai semak belum dimuatkan. Sila minta Admin log masuk sekali.') + '</p><button class="btn" data-act="signout">' + T('Sign out', 'Log keluar') + '</button></div></div>'; return; }
      const std = await (await fetch('templates.json', {cache: 'no-store'})).json();
      await rpc('mic_seed_templates', {p_data: std}); b = await rpc('mic_boot');
      toast(T('Standard F52 checklists loaded', 'Senarai semak F52 standard dimuatkan'));
    }
    S.tpls = b.templates; S.today = b.today; if (!S.date) S.date = S.today;
    route();
  } catch (e) { fail(e); if (!S.me) vLogin(); }
}

/* ---------- shell + router ---------- */
function shell(tab, html) {
  const adm = can('admin');
  const n = (h, l, k) => '<a href="#/' + h + '" class="' + (tab === k ? 'on' : '') + '">' + l + '</a>';
  $('#app').innerHTML = '<div class="top"><div class="brand">' + T('Machine Inspection', 'Pemeriksaan Mesin') + ' <small>F52</small></div><div class="who" title="' + esc(S.me.login) + '">' + esc(S.me.name) + '<br>' + esc(myFuncs()) + '</div>' +
    '<button data-act="lang" aria-label="Language">' + (LANG === 'bm' ? 'EN' : 'BM') + '</button><button data-act="menu" aria-label="Account">&#9776;</button></div>' +
    '<nav class="nav">' + n('today', T('Today', 'Hari ini'), 'today') + n('records', T('Records', 'Rekod'), 'records') + (adm ? n('setup', T('Checklists', 'Senarai semak'), 'setup') + n('users', T('Users', 'Pengguna'), 'users') : '') + '<a href="guide.html?lang=' + LANG + '" target="_blank" rel="noopener">&#128214; ' + T('Guide', 'Panduan') + '</a></nav><main>' + html + '</main>';
}
// Auto-refresh for the page that is open. Only ONE timer may exist, it stops as soon as the user moves to
// another page, and it never redraws the screen unless the data really changed.
function setPoll(fn) {
  clearInterval(S.poll); const at = location.hash;
  const id = setInterval(() => { if (location.hash !== at) return clearInterval(id); if (!document.hidden && !$('.modal-bg') && !$('.lightbox')) fn().catch(() => {}); }, window.MIC_POLL_MS || 30000);
  S.poll = id;
}
function go(h) { if (location.hash === '#/' + h) route(); else location.hash = '#/' + h; }
async function route() {
  clearInterval(S.poll); S.poll = null; S.editing = false;
  if (!S.me || !S.me.active) return;
  const p = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
  try {
    if (p[0] === 'sheet' && tpl(p[1])) return await vSheet(p[1], p[2] || S.today);
    if (p[0] === 'round' && tpl(p[1])) return await vRound(p[1], p[2], p[3]);
    if (p[0] === 'records') return await vRecords();
    if (p[0] === 'setup' && can('admin')) return vSetup(p[1]);
    if (p[0] === 'users' && can('admin')) return await vUsers();
    return await vToday();
  } catch (e) { fail(e); }
}
window.addEventListener('hashchange', () => { if (S.dirty) saveDraft(true); route(); });

/* ---------- Today ---------- */
function rvChips(rs) {
  const p = rs.reduce((a, r) => a + (r.status === 'draft' ? 0 : r.rv_pending || 0), 0), hd = rs.reduce((a, r) => a + (r.status === 'draft' ? 0 : r.rv_hold || 0), 0);
  return (p ? '<span class="chip warn">' + p + ' ' + T('to decide', 'perlu keputusan') + '</span> ' : '') + (hd ? '<span class="chip bad">&#9940; ' + hd + ' ' + T('on HOLD', 'DITAHAN') + '</span>' : '');
}
function roundChips(rs) {
  const c = k => rs.filter(r => r.status === k).length, ng = rs.reduce((a, r) => a + (r.ng || 0), 0);
  let h = '';
  if (c('draft')) h += '<span class="chip warn">' + c('draft') + ' ' + T('in progress', 'sedang diisi') + '</span> ';
  if (c('submitted')) h += '<span class="chip info">' + c('submitted') + ' ' + T('to check', 'untuk disemak') + '</span> ';
  if (c('checked')) h += '<span class="chip ok">' + c('checked') + ' ' + T('checked', 'disemak') + '</span> ';
  if (ng) h += '<span class="chip bad">' + ng + ' ' + T('Not OK', 'Tidak OK') + '</span> ';
  return h + rvChips(rs);
}
async function vToday(quiet) {
  const at = location.hash, day = await rpc('mic_range', {p_from: S.date, p_to: S.date}), sig = S.date + JSON.stringify(day);
  if (quiet && (location.hash !== at || sig === S.daySig)) return;   // moved away, or nothing changed
  S.day = day; S.daySig = sig;
  const cards = S.tpls.map(t => {
    const d = S.day.find(x => x.machine === t.key), rs = d ? d.rounds : [];
    let st;
    if (t.status === 'not_in_use') st = '<span class="chip">' + MSTAT().not_in_use + '</span>';
    else if (!d || !rs.length) st = '<span class="chip">' + T('Not inspected yet', 'Belum diperiksa') + '</span>';
    else if (d.status === 'verified') st = '<span class="chip ok">&#10003; ' + T('Verified', 'Disahkan') + '</span> ' + roundChips(rs).replace(/<span class="chip ok">.*?<\/span> /, '');
    else st = roundChips(rs);
    return '<a class="card mcard' + (t.status === 'not_in_use' ? ' off' : '') + '" href="#/sheet/' + t.key + '/' + S.date + '"><div><h3>' + esc(t.name) + '</h3><div class="fn">' + esc(t.formNo) + ' &middot; Rev ' + esc(t.rev) + ' &middot; ' + allItems(t).length + ' ' + T('parts', 'bahagian') + '</div></div>' +
      '<div>' + st + (t.status === 'pending' ? ' <span class="chip warn">' + MSTAT().pending + '</span>' : '') + '</div>' +
      (rs.length ? '<div class="small muted">' + rs.length + ' ' + T('inspection(s)', 'pemeriksaan') + ': ' + rs.map(r => esc(r.time || '--:--')).join(', ') + '</div>' : '') + '</a>';
  }).join('');
  const toCheck = S.day.reduce((a, d) => a + d.rounds.filter(r => r.status === 'submitted').length, 0);
  const toDecide = S.day.reduce((a, d) => a + d.rounds.reduce((x, r) => x + (r.status === 'draft' ? 0 : r.rv_pending || 0), 0), 0);
  const toVerify = S.day.filter(d => d.status === 'open' && d.rounds.length && d.rounds.every(r => r.status === 'checked')).length;
  shell('today', '<div class="datebar"><button class="btn sm" data-act="day" data-n="-1" aria-label="Previous day">&#9664;</button><input type="date" id="daypick" value="' + S.date + '" max="' + S.today + '"><button class="btn sm" data-act="day" data-n="1" aria-label="Next day"' + (S.date >= S.today ? ' disabled' : '') + '>&#9654;</button>' +
    (S.date !== S.today ? '<button class="btn sm" data-act="day" data-n="0">' + T('Today', 'Hari ini') + '</button>' : '') + '<span class="muted">' + fmtD(S.date) + '</span><span class="sp"></span><button class="btn sm" data-act="refresh">&#8635; ' + T('Refresh', 'Muat semula') + '</button></div>' +
    ((can('check') || can('verify')) && toDecide ? '<div class="banner">' + toDecide + ' ' + T('Not OK part(s) waiting for a decision (Can proceed / Hold)', 'bahagian Tidak OK menunggu keputusan (Boleh teruskan / Tahan)') + '</div>' : '') +
    (can('check') && toCheck ? '<div class="banner info">' + toCheck + ' ' + T('inspection(s) waiting for Check by', 'pemeriksaan menunggu Check by') + '</div>' : '') +
    (can('verify') && toVerify ? '<div class="banner info">' + toVerify + ' ' + T('checklist(s) ready for Verify by', 'senarai semak sedia untuk Verify by') + '</div>' : '') +
    '<div class="grid">' + cards + '</div>');
  setPoll(() => vToday(true));
}

/* ---------- Sheet (one machine, one day) ---------- */
function canStart(t, sh, date) { return can('fill') && t.status !== 'not_in_use' && (!sh || sh.status !== 'verified') && (can('admin') || (date <= S.today && date >= addDays(S.today, -1))); }
function stChip(r) { return r.status === 'draft' ? '<span class="chip warn">' + T('In progress', 'Sedang diisi') + '</span>' : r.status === 'submitted' ? '<span class="chip info">' + T('Waiting for check', 'Menunggu semakan') + '</span>' : '<span class="chip ok">&#10003; ' + T('Checked', 'Disemak') + '</span>'; }
async function vSheet(key, date, quiet) {
  const at = location.hash, sh = await rpc('mic_sheet', {p_machine: key, p_date: date}), sig = key + date + JSON.stringify(sh);
  if (quiet && (location.hash !== at || sig === S.sheetSig)) return;   // moved away, or nothing changed
  const fw = quiet && $('.f52-wrap'), keep = fw ? [fw.scrollLeft, fw.scrollTop, window.scrollY, !!($('main details') || {}).open] : null;
  S.sheet = sh; S.sheetSig = sig;
  const t = sh ? sh.template : tpl(key), rs = sh ? sh.rounds : [];
  const ver = sh && sh.status === 'verified';
  const allChecked = rs.length && rs.every(r => r.status === 'checked');
  const mine = sh && rs.some(r => r.done_by === S.me.id || r.check_by === S.me.id);
  let h = '<div class="row" style="margin-bottom:10px"><a class="btn sm" href="#/today">&#9664; ' + T('Back', 'Kembali') + '</a><span class="sp"></span><button class="btn sm pri" data-act="pdf"' + (sh && rs.some(r => r.status !== 'draft') ? '' : ' disabled title="' + T('Available after an inspection is submitted', 'Tersedia selepas pemeriksaan dihantar') + '"') + '>&#11015; ' + T('Download PDF', 'Muat turun PDF') + '</button><button class="btn sm" data-act="print" data-ph="1">&#128424; ' + T('Print F52', 'Cetak F52') + '</button><button class="btn sm" data-act="print" data-ph="0">' + T('Print without photos', 'Cetak tanpa gambar') + '</button></div>' +
    '<div class="card"><div class="row"><div><h2>' + esc(t.title) + (t.key.startsWith('drum') ? ' &ndash; ' + esc(t.name.replace('Drum Mixer ', '')) : '') + '</h2><div class="small muted">Form No.: ' + esc(t.formNo) + ' &middot; Revision: ' + esc(t.rev) + ' &middot; Effective Date: ' + esc(t.eff) + '</div></div><span class="sp"></span>' +
    (ver ? '<span class="chip ok">&#10003; ' + T('Verified', 'Disahkan') + '</span>' : '<span class="chip">' + T('Open', 'Terbuka') + '</span>') + '</div>' +
    '<div style="margin-top:6px"><b>DATE: ' + fmtD(date) + '</b></div>' +
    (t.status === 'pending' ? '<div class="banner">' + T('The condition criteria for this machine are still pending inspection. Check with QA before relying on them.', 'Kriteria keadaan untuk mesin ini belum dimuktamadkan. Rujuk QA sebelum bergantung padanya.') + '</div>' : '') +
    (t.status === 'not_in_use' ? '<div class="banner">' + T('This machine is marked Not in use. Admin can change this under Checklists.', 'Mesin ini ditanda Tidak Digunakan. Admin boleh menukarnya di bawah Senarai semak.') + '</div>' : '') +
    (ver ? '<div class="banner info" style="margin-bottom:0">Verify by: ' + esc(sh.verify_name) + ' &middot; ' + fmtDT(sh.verify_at) + (sh.verify_note ? ' &middot; ' + esc(sh.verify_note) : '') + '</div>' : '') +
    '<div class="row" style="margin-top:12px">' +
    (canStart(t, sh, date) ? '<button class="btn pri" data-act="start" data-k="' + key + '" data-d="' + date + '">+ ' + (rs.some(r => r.status === 'draft' && r.done_by === S.me.id) ? T('Continue my inspection', 'Sambung pemeriksaan saya') : T('Start new inspection', 'Mula pemeriksaan baharu')) + '</button>' : '') +
    (can('verify') && sh && !ver ? '<button class="btn pri" data-act="verify" ' + (allChecked && !mine ? '' : 'disabled') + ' title="' + (mine ? T('You filled in or checked this checklist, so another person must verify it', 'Anda mengisi atau menyemak senarai ini, jadi orang lain perlu mengesahkannya') : '') + '">&#10003; ' + T('Verify checklist (Verify by)', 'Sahkan senarai semak (Verify by)') + '</button>' : '') +
    (can('admin') && ver ? '<button class="btn bad" data-act="reopen">' + T('Reopen', 'Buka semula') + '</button>' : '') +
    (can('admin') && sh && !ver ? '<span class="sp"></span><button class="btn bad sm" data-act="delrec" data-id="' + sh.id + '" data-n="' + esc(t.name + ', ' + fmtD(date)) + '">&#128465; ' + T('Delete record', 'Padam rekod') + '</button>' : '') + '</div></div>';
  h += '<h3 style="margin:16px 0 8px">' + T('Inspections for this date', 'Pemeriksaan untuk tarikh ini') + ' (' + rs.length + ')</h3>';
  h += '<p class="small muted" style="margin:-4px 0 8px">' + T('Each time this machine is inspected (before production starts, and at every product change-over) it is saved here as Inspection 1, 2, 3...', 'Setiap kali mesin ini diperiksa (sebelum pengeluaran bermula, dan pada setiap pertukaran produk) ia disimpan di sini sebagai Pemeriksaan 1, 2, 3...') + '</p>';
  if (!rs.length) h += '<div class="card muted">' + T('No inspection recorded for this date yet. Inspect before production starts and at every product change-over.', 'Belum ada pemeriksaan direkod untuk tarikh ini. Periksa sebelum pengeluaran bermula dan pada setiap pertukaran produk.') + '</div>';
  h += rs.map(r => '<div class="rcard"><div><b>' + T('Inspection', 'Pemeriksaan') + ' ' + r.seq + '</b> &middot; <span class="num">' + esc(r.time || '--:--') + '</span> &middot; Batch ' + esc(r.batch || '-') + '<div class="small muted">Done by: ' + esc(r.done_name) + (r.check_name ? ' &middot; Check by: ' + esc(r.check_name) + ' ' + fmtDT(r.check_at) : '') + '</div>' +

    stChip(r) + (r.ng ? '<span class="chip bad">' + r.ng + ' ' + T('Not OK', 'Tidak OK') + '</span>' : '') + rvChips([r]) +
    '<a class="btn sm' + (r.status === 'draft' && r.done_by === S.me.id || r.status === 'submitted' && can('check') && r.done_by !== S.me.id ? ' pri' : '') + '" href="#/round/' + key + '/' + date + '/' + r.id + '">' + (r.status === 'draft' && r.done_by === S.me.id ? T('Continue', 'Sambung') : r.status === 'submitted' && can('check') && r.done_by !== S.me.id ? T('Check', 'Semak') : T('View', 'Lihat')) + '</a></div>').join('');
  h += '<h3 style="margin:18px 0 8px">' + T('Form view', 'Paparan borang') + ' (' + esc(t.formNo) + ')</h3><div class="f52-wrap">' + f52Table(t, rs, sh, date, {screen: true, photos: true}) + '</div>';
  if (sh && sh.log && sh.log.length) h += '<details style="margin-top:14px"><summary class="muted">' + T('Change history', 'Sejarah perubahan') + ' (' + sh.log.length + ')</summary><div class="tbl-wrap" style="margin-top:8px"><table class="list"><tr><th>' + T('When', 'Bila') + '</th><th>' + T('Who', 'Siapa') + '</th><th>' + T('What', 'Apa') + '</th></tr>' +
    sh.log.map(l => '<tr><td class="nowrap">' + fmtDT(l.at) + '</td><td>' + esc(l.name) + '</td><td>' + esc(l.act.replace(/_/g, ' ')) + (l.detail && l.detail.round ? ' #' + l.detail.round : '') + (l.detail && (l.detail.reason || l.detail.note) ? ' &ndash; ' + esc(l.detail.reason || l.detail.note) : '') + '</td></tr>').join('') + '</table></div></details>';
  shell('today', h);
  if (keep) { const w = $('.f52-wrap'); if (w) { w.scrollLeft = keep[0]; w.scrollTop = keep[1]; } const dt = $('main details'); if (dt && keep[3]) dt.open = true; window.scrollTo(0, keep[2]); }
  setPoll(() => vSheet(key, date, true));
}

/* F52 layout: used for the on-screen form view and for printing */
function rvLabel(a) { const v = a && a.rv; return v ? (v.s === 'major' ? 'MAJOR' : 'MINOR') + ': ' + (v.d === 'go' ? 'CAN PROCEED' : 'HOLD') : 'DECISION PENDING'; }
function ansCells(t, it, r) {
  const a = r && r.items ? r.items[it.id] : null;

async function saveTpl() {

    else if (a === 'uadd') addUserForm();
    else if (a === 'usave') { const tr = el.closest('tr'); await rpc('mic_save_user', {p_id: tr.dataset.u, p_name: $('.u-name', tr).value, p_funcs: $$('.u-f:checked', tr).map(x => x.value), p_active: $('.u-act', tr).checked}); if (tr.dataset.u === S.me.id) S.me = await rpc('mic_me', {p_name: null}); toast(T('Saved', 'Disimpan')); await vUsers(); }
    else if (a === 'upw') { const tr = el.closest('tr'); const p = await ask({title: T('Set a new password for ', 'Tetapkan kata laluan baharu untuk ') + $('.u-name', tr).value, input: 'password', label: T('New password (at least 8 characters)', 'Kata laluan baharu (sekurang-kurangnya 8 aksara)'), required: true, ok: T('Set password', 'Tetapkan')}); if (p) { await rpc('mic_reset_password', {p_id: tr.dataset.u, p_password: p}); toast(T('New password set. Tell the staff member.', 'Kata laluan baharu ditetapkan. Maklumkan kepada staf.')); } }
  } catch (x) { fail(x); if (el.disabled) el.disabled = false; }
});
window.addEventListener('beforeunload', e => { if (S.dirty && S.editing) { saveDraft(true); e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden && S.dirty && S.editing) saveDraft(true); });
sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') setTimeout(changePw, 300); });
document.documentElement.lang = LANG === 'bm' ? 'ms' : 'en';
boot();
</script>
